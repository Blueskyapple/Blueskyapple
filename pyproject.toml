[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "code-assistant"
version = "0.1.0"
description = "A Claude Code-style AI coding agent for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "pathspec>=0.12.0",
]

[project.scripts]
code-assistant = "code_assistant.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_assistant*"]
