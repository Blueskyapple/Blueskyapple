[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluebot"
version = "0.1.0"
description = "A self-hosted personal AI assistant with messaging integration and persistent memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "assistant", "bot", "llm", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "schedule>=1.2",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
telegram = ["python-telegram-bot>=21.0"]
all = ["discord.py>=2.3", "python-telegram-bot>=21.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bluebot = "bluebot.__main__:main"

[project.urls]
Repository = "https://github.com/Blueskyapple/Blueskyapple"

[tool.setuptools.packages.find]
include = ["bluebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
